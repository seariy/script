#修改TNAME: K2P 中的K2P为你需要编译的型号，注意名称要与configs/templates/目录下的名字相同
name: Padavan_chongshengB

on: 
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
    - name: Checkout
      uses: actions/checkout@master
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget
    
    - name: Clone source code
      env:
        KERNEL: 4.4
      run: |
        if [ $KERNEL = "4.4" ] ; then
        git clone --depth=1 https://github.com/0xChen/padavan-4.4.git /opt/rt-n56u
        else
        git clone --depth=1 https://github.com/chongshengB/rt-n56u.git /opt/rt-n56u
        fi
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/
    
    - name: Build Firmware
      env:
        TNAME: K2P-SUB
        KERNEL: 4.4
      run: |
        cd /opt/rt-n56u/trunk
        if [ ! -f configs/templates/$TNAME.config ] ; then
        echo "configs/templates/$TNAME.config not found "
        exit 1
        fi
        cp -f configs/templates/$TNAME.config .config
        
        ################################################################################################
        #因不同型号配置功能不一样，所以先把配置项删除，如果你自己要添加其他的，也要写上删除这一条，切记！！！
        ################################################################################################
        ##############  修改默认参数  ###################################################################
        sed -i 's/git rev-parse --short=7 HEAD/date +%Y%m%d/g' /opt/rt-n56u/trunk/versions.inc
        sed -i 's/"wl_APSDCapable", "0"/"wl_APSDCapable", "1"/g' /opt/rt-n56u/trunk/user/shared/defaults.c
        sed -i 's/"rt_APSDCapable", "0"/"rt_APSDCapable", "1"/g' /opt/rt-n56u/trunk/user/shared/defaults.c
        sed -i 's/"sshd_enable", "1"/"sshd_enable", "0"/g' /opt/rt-n56u/trunk/user/shared/defaults.c
        sed -i 's/"lltd_enable", "1"/"lltd_enable", "0"/g' /opt/rt-n56u/trunk/user/shared/defaults.c
        sed -i 's/"crond_enable", "1"/"crond_enable", "0"/g' /opt/rt-n56u/trunk/user/shared/defaults.c
        sed -i 's/"watchdog_cpu", "1"/"watchdog_cpu", "0"/g' /opt/rt-n56u/trunk/user/shared/defaults.c
        sed -i 's/"wan_ppp_lcp", "1"/"wan_ppp_lcp", "0"/g' /opt/rt-n56u/trunk/user/shared/defaults.c
        sed -i 's/2.4G/2.4GHz/g' /opt/rt-n56u/trunk/user/www/dict/CN.dict
        sed -i 's/5G/5GHz/g' /opt/rt-n56u/trunk/user/www/dict/CN.dict
        sed -i 's/GO_2G=2.4GHz 设置/GO_2G=转到 2.4GHz 设置/g' /opt/rt-n56u/trunk/user/www/dict/CN.dict
        sed -i 's/GO_5GHz=5GHz 设置/GO_5G=转到 5GHz 设置/g' /opt/rt-n56u/trunk/user/www/dict/CN.dict
        sed -i 's/2.4G/2.4GHz/g' /opt/rt-n56u/trunk/user/www/n56u_ribbon_fixed/state.js
        sed -i 's/value="5G"/value="5GHz"/g' /opt/rt-n56u/trunk/user/www/n56u_ribbon_fixed/state.js
        
        ##############  清除默认选项  ###################################################################
        sed -i 's/=y/=n/g' /opt/rt-n56u/trunk/configs/templates/*.config

        ##############  添加定义选项  ###################################################################
        #以下选项是定义你需要的功能，（y=集成,n=忽略），重新写入到.config文件
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=n/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y/g' /opt/rt-n56u/trunk/configs/templates/*.config
        sed -i 's/CONFIG_FIRMWARE_ENABLE_IPV6=n/CONFIG_FIRMWARE_ENABLE_IPV6=y/g' /opt/rt-n56u/trunk/configs/templates/*.config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_LANG_CN=n/CONFIG_FIRMWARE_INCLUDE_LANG_CN=y/g' /opt/rt-n56u/trunk/configs/templates/*.config
        sed -i 's/CONFIG_FIRMWARE_INCLUDE_FTPD=n/CONFIG_FIRMWARE_INCLUDE_FTPD=y/g' /opt/rt-n56u/trunk/configs/templates/*.config
        
        ################################################################################################
        #########################################################################################
        #自定义添加其它功能请参考源码configs/templates/目录下的config文件。按照上面的格式添加即可
        #格式如下：
        #sed -i '/自定义项/d' .config
        #echo "自定义项=y" >> .config
        #########################################################################################
        sudo ./clear_tree
        sudo ./build_firmware_modify $TNAME 0
        sudo mv -f images/*.trx /opt/images/
    
    - name : Upload packages
      uses: actions/upload-artifact@master
      if: always()
      with:
        name: Padavan-packages
        path: /opt/images
