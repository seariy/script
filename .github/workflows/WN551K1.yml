##################################################
######      WN551K1       测试正常           ######
##################################################
name: Build WN551K1

on: 
  workflow_dispatch:

#设置仓库的读写权限
permissions:
  contents: write
env:
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@master
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget
        sudo timedatectl set-timezone Asia/Shanghai
    - name: Install UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        version: v4.2.4
        install-only: true

    - name: Clone source code
      env:
        KERNEL: 3.4
      run: |
        git clone --depth=1 https://github.com/seariy/Padavan-hanwckf.git /opt/rt-n56u
        rm -rf /opt/rt-n56u/trunk/user/www/n56u_ribbon_fixed/bootstrap
        cp -r theme/bootstrap /opt/rt-n56u/trunk/user/www/n56u_ribbon_fixed
        
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/
        
        #echo "修改 LAN IP 地址"
        sed -i "s/192.168.2/192.168.10/g" /opt/rt-n56u/trunk/user/shared/defaults.h

        #echo "修改 网口顺序"
        #sed -i "s/WAN=4/WAN=0/g" /opt/rt-n56u/trunk/configs/boards/JCG-836PRO/kernel-3.4.x-5.0.config
        #sed -i "s/LAN1=3/LAN1=1/g" /opt/rt-n56u/trunk/configs/boards/JCG-836PRO/kernel-3.4.x-5.0.config
        #sed -i "s/LAN2=2/LAN2=2/g" /opt/rt-n56u/trunk/configs/boards/JCG-836PRO/kernel-3.4.x-5.0.config
        #sed -i "s/LAN3=1/LAN3=3/g" /opt/rt-n56u/trunk/configs/boards/JCG-836PRO/kernel-3.4.x-5.0.config
        #sed -i "s/LAN4=0/LAN4=4/g" /opt/rt-n56u/trunk/configs/boards/JCG-836PRO/kernel-3.4.x-5.0.config

        #sed -i "s/WAN=4/WAN=0/g" /opt/rt-n56u/trunk/configs/boards/JCG-836PRO/kernel-3.4.x.config
        #sed -i "s/LAN1=3/LAN1=1/g" /opt/rt-n56u/trunk/configs/boards/JCG-836PRO/kernel-3.4.x.config
        #sed -i "s/LAN2=2/LAN2=2/g" /opt/rt-n56u/trunk/configs/boards/JCG-836PRO/kernel-3.4.x.config
        #sed -i "s/LAN3=1/LAN3=3/g" /opt/rt-n56u/trunk/configs/boards/JCG-836PRO/kernel-3.4.x.config
        #sed -i "s/LAN4=0/LAN4=4/g" /opt/rt-n56u/trunk/configs/boards/JCG-836PRO/kernel-3.4.x.config

        #echo "修改 2G 无线名称"
        sed -i 's/BOARD_PID "_%s"/"PDCN"/g' /opt/rt-n56u/trunk/user/shared/defaults.h

        #echo "修改 5G 无线名称"
        sed -i 's/BOARD_PID "_5G_%s"/"PDCN_5G"/g' /opt/rt-n56u/trunk/user/shared/defaults.h
        
        #echo "修改 2G 访客无线名称"
        sed -i 's/BOARD_PID "_GUEST_%s"/"GUEST"/g' /opt/rt-n56u/trunk/user/shared/defaults.h

        #echo "修改 5G 访客无线名称"
        sed -i 's/BOARD_PID "_GUEST_5G_%s"/"GUEST_5G"/g' /opt/rt-n56u/trunk/user/shared/defaults.h

    - name: Build Firmware
      env:
        TNAME: WN551K1
        KERNEL: 3.4
      run: |
        cd /opt/rt-n56u/trunk
        if [ ! -f configs/templates/$TNAME.config ] ; then
        echo "configs/templates/$TNAME.config 没有找到 "
        exit 1
        fi
        cp -f configs/templates/$TNAME.config .config

        ######  清除默认配置  ###############################################################
        
        #########################################################################################
        sudo ./clear_tree
        sudo ./build_firmware_modify $TNAME 0
        sudo mv -f images/*.trx /opt/images/WN551K1_3.4.3.9-099.trx
        cp -f .config /opt/images/${TNAME}.config
        echo "time=$(date '+%Y-%m-%d_%H%M')" >> $GITHUB_ENV
        echo "date=$(date '+%Y-%m-%d')" >> $GITHUB_ENV
    
    - name : Upload packages
      uses: actions/upload-artifact@master
      with:
        name: WN551K1_3.4-KVR_${{ env.time }}
        path: /opt/images

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        body: | 
                - WDR7300
               
        tag_name: WN551K1_3.4-KVR
        files: /opt/images/*.zip
