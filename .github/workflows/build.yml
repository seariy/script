##################################################
######      K2P+USB   测试正常               ######
##################################################
name: Build_K2P-USB

on: 
  workflow_dispatch:

#设置仓库的读写权限
permissions:
  contents: write
env:
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@master
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
        cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
        pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget
        sudo timedatectl set-timezone Asia/Shanghai
    - name: Install UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        version: v4.2.4
        install-only: true

    - name: Clone source code
      env:
        KERNEL: 3.4
      run: |
        git clone --depth=1 https://github.com/lmq8267/padavan-KVR.git /opt/rt-n56u
        rm -rf /opt/rt-n56u/trunk/user/www/n56u_ribbon_fixed/bootstrap
        cp -r theme/bootstrap /opt/rt-n56u/trunk/user/www/n56u_ribbon_fixed
        
        cd /opt/rt-n56u/toolchain-mipsel
        sh dl_toolchain.sh
        mkdir -p /opt/images/

        ##### 修改内存空间和 storage空间17m
        sed -i 's/0x200000/0x1100000/g' /opt/rt-n56u/trunk/configs/boards/K2P-USB/kernel-3.4.x-5.0.config
        sed -i 's/size_etc="6M"/size_etc="17M"/g' /opt/rt-n56u/trunk/user/scripts/dev_init.sh
        sed -i 's/size_tmp="24M"/size_tmp="120M"/g' /opt/rt-n56u/trunk/user/scripts/dev_init.sh
        sed -i 's/mtd_part_size=65536/mtd_part_size=17825792/g' /opt/rt-n56u/trunk/user/scripts/mtd_storage.sh

        #echo "修改 LAN IP 地址"
        sed -i "s/192.168.2/192.168.123/g" /opt/rt-n56u/trunk/user/shared/defaults.h

        #echo "修改 网口顺序"
        sed -i "s/WAN=4/WAN=0/g" /opt/rt-n56u/trunk/configs/boards/K2P-USB/kernel-3.4.x-5.0.config
        sed -i "s/LAN1=3/LAN1=1/g" /opt/rt-n56u/trunk/configs/boards/K2P-USB/kernel-3.4.x-5.0.config
        sed -i "s/LAN2=2/LAN2=2/g" /opt/rt-n56u/trunk/configs/boards/K2P-USB/kernel-3.4.x-5.0.config
        sed -i "s/LAN3=1/LAN3=3/g" /opt/rt-n56u/trunk/configs/boards/K2P-USB/kernel-3.4.x-5.0.config
        sed -i "s/LAN4=0/LAN4=4/g" /opt/rt-n56u/trunk/configs/boards/K2P-USB/kernel-3.4.x-5.0.config

        sed -i "s/WAN=4/WAN=0/g" /opt/rt-n56u/trunk/configs/boards/K2P-USB/kernel-3.4.x.config
        sed -i "s/LAN1=3/LAN1=1/g" /opt/rt-n56u/trunk/configs/boards/K2P-USB/kernel-3.4.x.config
        sed -i "s/LAN2=2/LAN2=2/g" /opt/rt-n56u/trunk/configs/boards/K2P-USB/kernel-3.4.x.config
        sed -i "s/LAN3=1/LAN3=3/g" /opt/rt-n56u/trunk/configs/boards/K2P-USB/kernel-3.4.x.config
        sed -i "s/LAN4=0/LAN4=4/g" /opt/rt-n56u/trunk/configs/boards/K2P-USB/kernel-3.4.x.config

        #echo "修改 2G 无线名称"
        sed -i 's/BOARD_PID "_%s"/"PDCN"/g' /opt/rt-n56u/trunk/user/shared/defaults.h

        #echo "修改 5G 无线名称"
        sed -i 's/BOARD_PID "_5G_%s"/"PDCN_5G"/g' /opt/rt-n56u/trunk/user/shared/defaults.h
        
        #echo "修改 2G 访客无线名称"
        sed -i 's/BOARD_PID "_GUEST_%s"/"GUEST"/g' /opt/rt-n56u/trunk/user/shared/defaults.h

        #echo "修改 5G 访客无线名称"
        sed -i 's/BOARD_PID "_GUEST_5G_%s"/"GUEST_5G"/g' /opt/rt-n56u/trunk/user/shared/defaults.h

    - name: Build Firmware
      env:
        TNAME: K2P-USB
        KERNEL: 3.4
      run: |
        cd /opt/rt-n56u/trunk
        if [ ! -f configs/templates/$TNAME.config ] ; then
        echo "configs/templates/$TNAME.config 没有找到 "
        exit 1
        fi
        cp -f configs/templates/$TNAME.config .config

        ######  清除默认配置  ###############################################################
        sed -i '/CONFIG_FIRMWARE_ENABLE_IPV6/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_USB/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_UFSD/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_FAT/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_EXFAT/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_EXT2/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_EXT3/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_EXT4/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_XFS/d' .config
        sed -i '/CONFIG_FIRMWARE_ENABLE_FUSE/d' .config

        sed -i '/CONFIG_FIRMWARE_ENABLE_SWAP/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_UVC/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_HID/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SERIAL/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_AUDIO/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_XFRM/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_QOS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_IMQ/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_IFB/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_IPSET/d' .config

        sed -i '/CONFIG_FIRMWARE_INCLUDE_NFSD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_NFSC/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_CIFS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_NTFS_3G/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_LPRD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_U2EC/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TCPDUMP/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_HDPARM/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_PARTED/d' .config

        sed -i '/CONFIG_FIRMWARE_INCLUDE_SMBD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SMBD36/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_WINS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SMBD_SYSLOG/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_FTPD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_RPL2TP/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_EAP_PEAP/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_DDNS_SSL/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_HTTPS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SFTP/d' .config

        sed -i '/CONFIG_FIRMWARE_INCLUDE_DROPBEAR/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_DROPBEAR_FAST_CODE/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_OPENSSH/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_OPENVPN/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SSWAN/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_XUPNPD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_MINIDLNA/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_FIREFLY/d' .config

        sed -i '/CONFIG_FIRMWARE_INCLUDE_FFMPEG_NEW/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TRANSMISSION/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TRANSMISSION_WEB_CONTROL/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ARIA/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_CURL/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_GDUT_DRCOM/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_DOGCOM/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_MINIEAP/d' .config

        sed -i '/CONFIG_FIRMWARE_INCLUDE_NJIT_CLIENT/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_NAPT66/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SSSERVER/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_SERVER/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CLIENT/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CMD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_VLMCSD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TTYD/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_LRZSZ/d' .config

        sed -i '/CONFIG_FIRMWARE_INCLUDE_HTOP/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_NANO/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_IPERF3/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_DUMP1090/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_RTL_SDR/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_MTR/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SOCAT/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SRELAY/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_MENTOHUST/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPC/d' .config

        sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TUNSAFE/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_WIREGUARD/d' .config   
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ZEROTIER/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_ALIDDNS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_V2RAY/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_XRAY/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_TROJAN/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_SSOBFS/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_NPC/d' .config
        sed -i '/CONFIG_FIRMWARE_WEBUI_HIDE_VPN/d' .config
        sed -i '/CONFIG_FIRMWARE_INCLUDE_OPENVPN/d' .config

        ############################################################
        ### 2. Linux 内核配置（底层功能支持，影响硬件兼容性和核心能力）
        #  以下选项是定义你需要的功能，（y=集成,n=忽略），重新写入到.config文件
        ############################################################
        ### SFE    Linux kernel and toolchain
        # 启用 SFE 网络加速：提升路由转发速率，降低延迟（推荐开启，非必需但强烈建议）
        echo "CONFIG_FIRMWARE_INCLUDE_SFE=y" >> .config

        ### Enable IPv6 support
        # 启用 IPv6 支持：VLESS 节点多数支持 IPv6，后续代理必需开启（必需配置）
        # 即使仅使用 IPv4 节点，开启后也不影响兼容性，避免后续修改
        echo "CONFIG_FIRMWARE_ENABLE_IPV6=y" >> .config

        ### Enable USB support
        # 启用 USB 总线功能：支持 USB 存储（U盘/硬盘）、USB 网卡等外设（非必需，按需开启）
        # 若路由器无 USB 接口可设为 n，有则开启，不影响 VLESS 代理
        echo "CONFIG_FIRMWARE_ENABLE_USB=y" >> .config

        #通过 Paragon 的 "ufsd" 驱动启用 NTFS 文件系统支持。约 0.4MB
        echo "echo "CONFIG_FIRMWARE_ENABLE_UFSD=y" >> .config

        ### Enable FAT/FAT32 filesystem support. ~0.1MB
        # 支持 FAT/FAT32 文件系统：U盘、移动硬盘最常用格式（必需配置，即使无 USB 也建议保留）
        echo "CONFIG_FIRMWARE_ENABLE_FAT=y" >> .config

        ### Enable exFAT (FAT/FAT32 too) filesystem support. ~0.12MB
        # 支持 exFAT 文件系统：大容量 U 盘/移动硬盘常用（非必需，按需开启）
        # 单文件超过 4GB 需开启，不影响 VLESS 代理
        echo "CONFIG_FIRMWARE_ENABLE_EXFAT=y" >> .config

        ### Enable EXT2 filesystem support. ~0.1MB
        # 禁用 EXT2 文件系统：老旧格式，极少使用，关闭节省固件体积（非必需）
        echo "CONFIG_FIRMWARE_ENABLE_EXT2=n" >> .config

        ### Enable EXT3 filesystem support. ~0.2MB
        # 禁用 EXT3 文件系统：EXT4 已兼容 EXT3/EXT2，无需重复开启（非必需）
        echo "CONFIG_FIRMWARE_ENABLE_EXT3=n" >> .config

        ### Enable EXT4 (EXT3/2 too) filesystem support. ~0.4MB
        # 支持 EXT4 文件系统：Linux 常用格式，硬盘分区首选（非必需，有 USB 硬盘则开启）
        echo "CONFIG_FIRMWARE_ENABLE_EXT4=y" >> .config

        ### Enable XFS filesystem support. ~0.6MB
        # 禁用 XFS 文件系统：服务器级格式，路由器极少使用，关闭节省体积（非必需）
        echo "CONFIG_FIRMWARE_ENABLE_XFS=n" >> .config

        ### Enable FUSE (filesystems in userspace) support. ~0.1MB
        # 启用 FUSE 文件系统：用户态文件系统，后续 OpenClash/Clash 插件依赖（必需配置）
        echo "CONFIG_FIRMWARE_ENABLE_FUSE=y" >> .config

        ### Enable swap files/partitions support. ~0.05MB
        # 禁用 SWAP 支持：路由器内存小（通常 128MB/256MB），开启后性能下降（非必需）
        echo "CONFIG_FIRMWARE_ENABLE_SWAP=n" >> .config

        ### Include UVC camera modules. ~0.2MB
        # 禁用 UVC 摄像头模块：路由器极少连接摄像头，关闭节省体积（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_UVC=n" >> .config

        ### Include USB-HID modules. ~0.2MB
        # 禁用 USB-HID 模块：鼠标/键盘等外设，路由器无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_HID=n" >> .config

        ### Include USB-Serial modules (e.g. pl2303). ~0.03MB
        # 禁用 USB-Serial 模块：串口设备（如调试器），普通用户无需（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_SERIAL=n" >> .config

        ### Include USB-Audio modules ~0.46MB
        # 禁用 USB-Audio 模块：音频设备，路由器无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_AUDIO=n" >> .config

        ### Include XFRM (IPsec) modules & iptables extension ~ 0.2MB
        # 禁用 XFRM 模块：IPsec VPN 相关，与 VLESS 代理无关，关闭节省体积（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_XFRM=n" >> .config

        ### Include network QoS scheduling modules. ~0.2MB
        # 禁用 QoS 调度模块：流量控制功能，简单路由无需，关闭节省体积（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_QOS=n" >> .config

        ### Include IMQ module for shapers (a bit of performance degradation). ~0.02MB
        # 禁用 IMQ 整形模块：QoS 依赖，已禁用 QoS 则关闭（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_IMQ=n" >> .config

        ### Include IFB module for shapers. ~0.03MB
        # 禁用 IFB 整形模块：QoS 依赖，已禁用 QoS 则关闭（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_IFB=n" >> .config

        ### Include IPSet utility and kernel modules. ~0.4MB
        # 启用 IPSet 工具：IP/域名规则匹配，后续 OpenClash 域名分流必需（必需配置）
        echo "CONFIG_FIRMWARE_INCLUDE_IPSET=n" >> .config

        ### Include NFSv3 server. ~0.6MB
        # 禁用 NFSv3 服务器：路由器作为共享服务器极少使用，关闭节省体积（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_NFSD=n" >> .config

        ### Include NFSv3 client. ~0.5MB
        # 启用 NFSv3 客户端：访问局域网 NFS 共享文件夹（非必需，按需开启）
        echo "CONFIG_FIRMWARE_INCLUDE_NFSC=y" >> .config

        ### Include CIFS (SMB) client. ~0.2MB
        # 禁用 CIFS 客户端：访问 Windows 共享文件夹，非必需（按需开启）
        echo "CONFIG_FIRMWARE_INCLUDE_CIFS=y" >> .config

        ############################################################
        ### 3. Userspace configuration（用户态工具/插件，决定固件最终功能）
        ############################################################

        ### Include WebUI international resources. Increased firmware size
        # 启用中文 WebUI：中文用户必需，保留该配置（必需配置）
        echo "CONFIG_FIRMWARE_INCLUDE_LANG_CN=y" >> .config
        

        ### Include NTFS-3G FUSE driver (instead of Paragon "ufsd"). ~0.4MB
        # 禁用 NTFS-3G 驱动：EXT4/FAT/exFAT 已覆盖常用场景，关闭节省体积（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_NTFS_3G=n" >> .config

        ### Include LPR printer daemon. ~0.12MB
        # 启用 LPR 打印机守护进程：连接网络打印机需开启，否则可关闭（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_LPRD=n" >> .config

        ### Include USB-over-Ethernet printer daemon. ~0.05MB
        # 禁用 USB-以太网打印机 daemon：极少使用，关闭节省体积（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_U2EC=n" >> .config

        ### Include "tcpdump" utility. ~0.6MB
        # 启用 tcpdump 工具：网络抓包，后续调试 VLESS 代理连接问题必需（推荐开启，非必需但实用）
        echo "CONFIG_FIRMWARE_INCLUDE_TCPDUMP=n" >> .config

        ### Include "hdparm" utility (allow set HDD spindown timeout and APM). ~0.1MB
        # 禁用 hdparm 工具：硬盘参数设置，路由器无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_HDPARM=n" >> .config

        ### Include "parted" utility (allow make GPT partitions). ~0.3MB
        # 启用 parted 工具：硬盘分区工具，格式化 USB 硬盘用（非必需，有硬盘则开启）
        echo "CONFIG_FIRMWARE_INCLUDE_PARTED=y" >> .config

        ### Include SMB3.6 (and WINS) server. ~1.5MB
        # 禁用 SMB3.6 服务器：路由器作为文件共享服务器极少使用，关闭节省体积（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_SMBD=n" >> .config

        ### Include WINS server only. ~0.4MB
        # 禁用 WINS 服务器：与 SMB 配合使用，已禁用 SMB 则关闭（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_WINS=n" >> .config

        ### Include syslog for SMB and WINS server. ~0.3MB
        # 禁用 SMB 日志：已禁用 SMB 服务器，关闭节省体积（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_SMBD_SYSLOG=n" >> .config

        ### Include FTP server. ~0.2MB
        # 启用 FTP 服务器：访问 USB 存储文件（非必需，按需开启）
        echo "CONFIG_FIRMWARE_INCLUDE_FTPD=y" >> .config

        ### Include alternative L2TP control client RP-L2TP. ~0.1MB
        # 禁用 L2TP 客户端：不使用 L2TP VPN 则关闭（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_RPL2TP=n" >> .config

        ### Include EAP-TTLS and EAP-PEAP authentication support. openssl ~1.2MB, wpa_supplicant +0.04MB
        # 启用 EAP-PEAP 认证：部分校园网/企业网需要，开启不影响 VLESS 代理（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_EAP_PEAP=y" >> .config

        ### Include HTTPS support. openssl ~1.2MB
        # 禁用 HTTPS 支持：无需则关闭，节省体积（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_HTTPS=y" >> .config

        ### Include sftp-server. openssl ~1.2MB, sftp-server ~0.06MB
        # 启用 SFTP 服务器：安全文件传输，比 FTP 更安全（非必需，按需开启）
        echo "CONFIG_FIRMWARE_INCLUDE_SFTP=y" >> .config

        ### Include dropbear SSH. ~0.3MB
        # 禁用 Dropbear SSH：已启用 OpenSSH，功能更全，无需重复开启（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_DROPBEAR=n" >> .config

        ### Make the dropbear symmetrical ciphers and hashes faster. ~0.06MB
        # 禁用 Dropbear 加速：已禁用 Dropbear，无需开启（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_DROPBEAR_FAST_CODE=n" >> .config

        ### Include OpenSSH instead of dropbear. openssl ~1.2MB, openssh ~1.0MB
        # 启用 OpenSSH：SSH 远程管理路由器，功能比 Dropbear 全（推荐开启，非必需但实用）
        echo "CONFIG_FIRMWARE_INCLUDE_OPENSSH=y" >> .config

        ### Include OpenVPN. IPv6 required. openssl ~1.2MB, openvpn ~0.4MB
        # 启用 OpenVPN：VPN 客户端/服务端，与 VLESS 代理不冲突（非必需，按需开启）
        echo "CONFIG_FIRMWARE_INCLUDE_OPENVPN=n" >> .config

        ### Include StrongSwan. XFRM modules ~0.2MB, strongswan ~0.7MB
        # 禁用 StrongSwan：IPsec VPN 工具，与 VLESS 无关，关闭节省体积（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_SSWAN=n" >> .config

        ### Include Elliptic Curves (EC) to openssl library. ~0.1MB
        # 启用 OpenSSL 椭圆曲线加密：OpenClash/Clash 及 OpenVPN 依赖（必需配置）
        echo "CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC=y" >> .config

        ### Include "openssl" executable for generate certificates. ~0.4MB
        # 启用 OpenSSL 命令行工具：生成加密证书，调试 VLESS 加密问题（推荐开启，非必需但实用）
        echo "CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y" >> .config

        ### Include xUPNPd IPTV mediaserver. ~0.3MB
        # 启用 xUPNPd：IPTV 媒体服务器，使用 IPTV 则开启（非必需，按需开启）
        echo "CONFIG_FIRMWARE_INCLUDE_XUPNPD=n" >> .config

        ### Include Minidlna UPnP mediaserver. ~1.6MB
        # 禁用 Minidlna：UPnP 媒体服务器，极少使用，关闭节省体积（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_MINIDLNA=n" >> .config

        ### Include Firefly iTunes mediaserver. ~1.0MB
        # 禁用 Firefly：iTunes 媒体服务器，无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_FIREFLY=n" >> .config

        ### Include ffmpeg 0.11.x instead of 0.6.x for Minidlna and Firefly. ~0.1MB
        # 启用新版 ffmpeg：xUPNPd 依赖，已开启 xUPNPd 则必需（非必需，随 xUPNPd 开启）
        echo "CONFIG_FIRMWARE_INCLUDE_FFMPEG_NEW=n" >> .config
        

        ### Include Transmission torrent. openssl ~1.2MB, transmission ~1.5MB
        # 禁用 Transmission：BT 下载工具，体积大，不使用则关闭（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_TRANSMISSION=n" >> .config

        ### Include Transmission-Web-Control (advanced WebUI). ~0.8MB
        # 禁用 Transmission WebUI：已禁用 Transmission，无需开启（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_TRANSMISSION_WEB_CONTROL=n" >> .config

        ### Include Aria2 download manager. openssl ~1.2MB, aria2 ~3.5MB
        # 启用 Aria2：多协议下载工具（HTTP/HTTPS/FTP），支持离线下载（非必需，按需开启）
        echo "CONFIG_FIRMWARE_INCLUDE_ARIA=n" >> .config

        ### Include Aria2 WEB control. ~0.7MB
        # 启用 Aria2 WebUI：网页管理下载任务，启用 Aria2 则必需（非必需，随 Aria2 开启）
        echo "CONFIG_FIRMWARE_INCLUDE_ARIA_WEB_CONTROL=n" >> .config


        # 启用 curl 工具：HTTP 请求工具，OpenClash 订阅解析/节点测试依赖（必需配置）
        echo "CONFIG_FIRMWARE_INCLUDE_CURL=y" >> .config

        # 禁用 SCUT 客户端：特定校园网认证，无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT=n" >> .config

        # 禁用 GDUT DRCOM 客户端：特定校园网认证，无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_GDUT_DRCOM=n" >> .config

        # 禁用 Dogcom 客户端：特定校园网认证，无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_DOGCOM=n" >> .config

        # 禁用 Minieap 客户端：特定校园网认证，无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_MINIEAP=n" >> .config

        # 禁用 NJIT 客户端：特定校园网认证，无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_NJIT_CLIENT=n" >> .config

        # 禁用 SoftEther VPN 服务器：无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_SERVER=n" >> .config

        # 禁用 SoftEther VPN 客户端：无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CLIENT=n" >> .config

        # 禁用 SoftEther VPN 命令行工具：无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CMD=n" >> .config

        # 启用 VLMCSD：KMS 激活工具，按需开启（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_VLMCSD=n" >> .config

        # 启用 ttyd：Web 终端，远程管理路由器（推荐开启，非必需但实用）
        echo "CONFIG_FIRMWARE_INCLUDE_TTYD=y" >> .config

        # 禁用 lrzsz：串口文件传输，无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_LRZSZ=n" >> .config

        # 启用 htop：系统监控工具，查看进程/资源占用（推荐开启，非必需但实用）
        echo "CONFIG_FIRMWARE_INCLUDE_HTOP=y" >> .config

        # 启用 nano：命令行文本编辑器，修改配置文件（必需配置）
        echo "CONFIG_FIRMWARE_INCLUDE_NANO=y" >> .config

        # 启用 iperf3：网络测速工具，调试 VLESS 代理网速（推荐开启，非必需但实用）
        echo "CONFIG_FIRMWARE_INCLUDE_IPERF3=n" >> .config

        # 禁用 dump1090：飞机雷达接收工具，无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_DUMP1090=n" >> .config

        # 禁用 RTL-SDR：无线电接收工具，无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_RTL_SDR=n" >> .config

        # 启用 mtr：网络路由跟踪工具，调试 VLESS 代理连接路径（推荐开启，非必需但实用）
        echo "CONFIG_FIRMWARE_INCLUDE_MTR=n" >> .config

        # 启用 socat：端口转发/网络中继，调试 VLESS 端口问题（推荐开启，非必需但实用）
        echo "CONFIG_FIRMWARE_INCLUDE_SOCAT=n" >> .config

        # 启用 srelay：简单中继工具，按需开启（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_SRELAY=y" >> .config

        # 禁用 Mentohust：校园网认证工具，无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_MENTOHUST=n" >> .config

        # 禁用 FRPC：内网穿透客户端，无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_FRPC=n" >> .config

        # 禁用 FRPS：内网穿透服务器，无需使用（非必需）
        echo "CONFIG_FIRMWARE_INCLUDE_FRPS=n" >> .config

        # 启用 WireGuard：轻量 VPN，与 VLESS 代理不冲突（非必需，按需开启）
        echo "CONFIG_FIRMWARE_INCLUDE_WIREGUARD=y" >> .config


        ##为 DDNS 客户端包含 HTTPS 支持。openssl 约 1.2MB
        echo "CONFIG_FIRMWARE_INCLUDE_DDNS_SSL=y" >> .config

        ## IPV6中继
        echo "CONFIG_FIRMWARE_INCLUDE_NAPT66=y" >> .config

        ## ss服务器
        echo "CONFIG_FIRMWARE_INCLUDE_SSSERVER=n" >> .config
        
        ## DNS转发 已删除 请查看/trunk/user/httpd/common.h
        echo "CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER=n" >> .config
        
        ######################################################################
        
        ######################################################################
        echo "CONFIG_FIRMWARE_INCLUDE_VNTCLI=n" >> .config #vnt客户端 约80k
        echo "CONFIG_FIRMWARE_INCLUDE_VNTS=n" >> .config #vnt服务端 约50k
        echo "CONFIG_FIRMWARE_INCLUDE_CLOUDFLARED=y" >> .config #CF的隧道 约50k
        echo "CONFIG_FIRMWARE_INCLUDE_CLOUDFLARE=y" >> .config #CF-ddns 约50k
        echo "CONFIG_FIRMWARE_INCLUDE_ZEROTIER=y" >> .config ## zerotier 约 20k
        echo "CONFIG_FIRMWARE_INCLUDE_TUNSAFE=n" >> .config ## tunsafe（wireguard的TCP方式）
        echo "CONFIG_FIRMWARE_INCLUDE_EASYTIER=n" >> .config #EasyTier 约50k
        echo "CONFIG_FIRMWARE_INCLUDE_TAILSCALE=n" >> .config #tailscale 约20k

        echo "CONFIG_FIRMWARE_INCLUDE_CADDY=y" >> .config #在线文件管理服务不占空间(4.0kb左右)
        echo "CONFIG_FIRMWARE_INCLUDE_ALIST=n" >> .config #ALIST文件列表 约80k
        echo "CONFIG_FIRMWARE_INCLUDE_SMARTDNS=n" >> .config #smartdns
        echo "CONFIG_FIRMWARE_INCLUDE_ADGUARDHOME=n" >> .config #adguardhome不占空间(7.2kb左右)
        echo "CONFIG_FIRMWARE_INCLUDE_NETCAT=y" >> .config #nc工具
        echo "CONFIG_FIRMWARE_INCLUDE_MSD_LITE=y" >> .config #MSD_LITE工具
        
        echo "CONFIG_FIRMWARE_INCLUDE_FRPC=n" >> .config  ## FRPC 客户端 约8k
        echo "CONFIG_FIRMWARE_INCLUDE_FRPS=n" >> .config  ## FRPS 服务端 约8k
        echo "CONFIG_FIRMWARE_INCLUDE_ALIDDNS=n" >> .config #阿里DDNS ~20k
        echo "CONFIG_FIRMWARE_INCLUDE_DDNSTO=n" >> .config #ddnsto 约800k  已删除 请查看/trunk/user/httpd/common.h
        echo "CONFIG_FIRMWARE_INCLUDE_NATPIERCE=n" >> .config #皎月连 约20k
        echo "CONFIG_FIRMWARE_INCLUDE_LUCKY=n" >> .config #LUCKY 约50k
        echo "CONFIG_FIRMWARE_INCLUDE_WXSEND=n" >> .config #微信推送 约50k
        echo "CONFIG_FIRMWARE_INCLUDE_UUPLUGIN=n" >> .config #网易UU加速器 约50k
        echo "CONFIG_FIRMWARE_INCLUDE_ALDRIVER=n" >> .config #阿里云盘 约50k
        sed -i 's/EVM_RESTART_ALDRIVER/EVM_RESTART_VIRTUALHERE/g' ./user/httpd/common.h
        echo "CONFIG_FIRMWARE_INCLUDE_VIRTUALHERE=n" >> .config #virtualhere 约30k 后期需要自行下载可执行文件 在trunk/user/virtualhere 
        echo "CONFIG_FIRMWARE_INCLUDE_WYY=n" >> .config #网易云解锁 约80k 已删除 /trunk/user/httpd/common.h
        echo "CONFIG_FIRMWARE_INCLUDE_BAFA=n" >> .config #巴法云 约90k

        #echo "CONFIG_FIRMWARE_INCLUDE_V2RAYA=n" >> .config #v2raya 已删除 /trunk/user/httpd/common.h
        #echo "CONFIG_FIRMWARE_INCLUDE_NVPPROXY=n" >> .config #NVPPROXY 已删除 请查看/trunk/user/httpd/common.h
        ##科学上网## 已删除 /trunk/user/httpd/common.h
        #echo "CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=n" >> .config #SS plus+ 科学上网插件
        #echo "CONFIG_FIRMWARE_INCLUDE_V2RAY=n" >> .config #无需集成会在线下载
        #echo "CONFIG_FIRMWARE_INCLUDE_XRAY=n" >> .config #无需集成会在线下载
        #echo "CONFIG_FIRMWARE_INCLUDE_TROJAN=n" >> .config #无需集成会在线下载
        #echo "CONFIG_FIRMWARE_INCLUDE_SSOBFS=n" >> .config # simple-obfs混淆插件
        
        #########################################################################################
        sudo ./clear_tree
        sudo ./build_firmware_modify $TNAME 0
        sudo mv -f images/*.trx /opt/images/K2P-USB_3.4.3.9-099.trx
        cp -f .config /opt/images/${TNAME}.config
        echo "date=$(date '+%Y-%m-%d')" >> $GITHUB_ENV
    
    - name : Upload packages
      uses: actions/upload-artifact@master
      with:
        name: K2P-USB_3.4-KVR_${{ env.date }}
        path: /opt/images

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        body:  K2P-USB_3.4-KVR 后台地址：192.168.123.1
               固件由 K2P-USB配置文件修改参数编译
        tag_name: K2P-USB_3.4-KVR_${{ env.date }}
        files: /opt/images/*.trx
