name: Build Padavan 4.4 Firmware (K2P-USB)

on:
  workflow_dispatch:
    inputs:
      target_model:
        description: 'Target Router Model'
        required: true
        default: 'K2P-USB'
      clean_cache:
        description: 'Clean toolchain cache'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: '0 19 * * 5' # Weekly automatic build (optional)
  push:
    branches: [ master, main ]
    paths:
      - 'trunk/configs/templates/K2P-USB.config'
      - '.github/workflows/build-padavan.yml'

env:
  SRC_REPO: 'https://github.com/chongshengB/rt-n56u.git'
  SRC_BRANCH: 'master'
  TARGET_MODEL: 'K2P-USB'
  FLASH_SIZE: '16M'
  ENABLE_CLOUDFLARED: 'true'
  ENABLE_CADDY: 'true'
  ENABLE_WIREGUARD: 'true'
  ENABLE_VNT: 'true'
  USE_UPX: 'true'
  FIRMWARE_DIR: '/opt/padavan-4.4'
  TOOLCHAIN_DIR: '/opt/padavan-4.4/toolchain-mipsel'

jobs:
  build:
    name: Compile ${{ inputs.target_model || 'K2P-USB' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Check Environment & Free Disk Space
        run: |
          echo "Current Runner OS: $(uname -a)"
          df -h
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          sudo -E apt-get -q update
          sudo -E apt-get -y install --no-install-recommends \
            build-essential autoconf automake autopoint bison build-essential \
            ca-certificates ccache cmake cpio curl flex gawk gcc-multilib gperf \
            help2man htop libbz2-dev libc6-dev-i386 libgmp-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev \
            libssl-dev libtool-bin lzip lzma net-tools pkg-config python3 \
            rsync subversion texinfo texi2html u-boot-tools upx upx-ucl wget \
            zip zlib1g-dev python-is-python3
          echo "Dependencies installed successfully!"

      - name: Cache Cross Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        if: ${{ github.event.inputs.clean_cache != 'true' }}
        with:
          path: /opt/padavan-4.4/toolchain-mipsel
          key: ${{ runner.os }}-padavan-toolchain-mt7621-v1

      - name: Clone Padavan 4.4 Kernel Source Tree
        run: |
          sudo mkdir -p /opt/padavan-4.4
          sudo chown -R $USER:$USER /opt/padavan-4.4
          git clone --depth=1 --branch ${{ env.SRC_BRANCH }} ${{ env.SRC_REPO }} /opt/padavan-4.4
          cd /opt/padavan-4.4
          echo "Commit SHA: $(git rev-parse HEAD)"

      - name: Build / Restore MIPSEL Toolchain
        run: |
          cd /opt/padavan-4.4/toolchain-mipsel
          if [ -f "toolchain-3.4.x/bin/mipsel-linux-uclibc-gcc" ]; then
            echo "Toolchain already exists from cache, skipping build."
          else
            echo "Building toolchain from clean source..."
            sh ./clean_sources
            sh ./build_toolchain
          fi

      - name: Apply Core Patches (AP Mode DHCP Fix & WebUI Drop Caches & USB Manager)
        run: |
          echo "=== 1. Applying AP Mode DHCP Auto-renew Fix ==="
          # Fix udhcpc stuck and link-down carrier renewal in AP/Bridge mode
          if [ -f "$GITHUB_WORKSPACE/patches/fix-ap-mode-dhcp-renew.patch" ]; then
            cd /opt/padavan-4.4
            patch -p1 < $GITHUB_WORKSPACE/patches/fix-ap-mode-dhcp-renew.patch
          fi
          # Inject background AP watchdog
          cp -f $GITHUB_WORKSPACE/scripts/ap_watchdog.sh /opt/padavan-4.4/trunk/user/scripts/
          chmod +x /opt/padavan-4.4/trunk/user/scripts/ap_watchdog.sh

          echo "=== 2. Transforming Top-Right Shutdown to Drop Caches (释放内存) ==="
          if [ -f "$GITHUB_WORKSPACE/patches/webui-drop-caches.patch" ]; then
            cd /opt/padavan-4.4
            patch -p1 < $GITHUB_WORKSPACE/patches/webui-drop-caches.patch
          fi

          echo "=== 3. Injecting Dedicated USB Storage Manager WebUI ==="
          if [ -f "$GITHUB_WORKSPACE/patches/webui-usb-storage-manager.patch" ]; then
            cd /opt/padavan-4.4
            patch -p1 < $GITHUB_WORKSPACE/patches/webui-usb-storage-manager.patch
          fi
          # Copy USB Manager ASP and icons
          cp -f $GITHUB_WORKSPACE/webui/Advanced_Storage_Manager.asp /opt/padavan-4.4/trunk/user/www/n56u_ribbon_fixed/ || true

      - name: Inject Plugins (Cloudflared, Caddy, WireGuard, VNT)
        run: |
          cd /opt/padavan-4.4/trunk
          bash $GITHUB_WORKSPACE/scripts/install_plugins.sh

      - name: Prepare K2P-USB Firmware Configuration
        run: |
          cd /opt/padavan-4.4/trunk
          # Copy custom board config
          if [ -f "$GITHUB_WORKSPACE/trunk/configs/templates/${{ env.TARGET_MODEL }}.config" ]; then
            cp -f $GITHUB_WORKSPACE/trunk/configs/templates/${{ env.TARGET_MODEL }}.config configs/templates/${{ env.TARGET_MODEL }}.config
          fi
          # Ensure flash layout corresponds to selected size
          if [ "${{ env.FLASH_SIZE }}" = "32M" ]; then
            sed -i 's/CONFIG_MTD_SPI_NOR_USE_4K_SECTORS=y/CONFIG_MTD_SPI_NOR_USE_4K_SECTORS=y\nCONFIG_MTD_STORE_PART_SIZ=0x1E00000/' configs/templates/${{ env.TARGET_MODEL }}.config || true
          fi

      - name: Compile K2P-USB Firmware
        id: compile
        run: |
          cd /opt/padavan-4.4/trunk
          sudo ./clear_tree
          sudo fakeroot ./build_firmware ${{ env.TARGET_MODEL }}

      - name: Verify Firmware Output & Size Budget Check
        run: |
          cd /opt/padavan-4.4/trunk/images
          ls -lh
          ROM_FILE=$(ls *.trx | head -n 1)
          ROM_SIZE=$(stat -c%s "$ROM_FILE")
          echo "Firmware File: $ROM_FILE"
          echo "Size in bytes: $ROM_SIZE"
          
          # Max flash budget for K2P:
          # 16M standard: ~16,121,856 bytes (0xF60000)
          # 32M mod: ~32,899,072 bytes (0x1F60000)
          if [ "${{ env.FLASH_SIZE }}" = "16M" ]; then
            MAX_BYTES=16121856
          else
            MAX_BYTES=32899072
          fi
          
          if [ $ROM_SIZE -gt $MAX_BYTES ]; then
            echo "::error::Firmware size ($ROM_SIZE) exceeds flash limit ($MAX_BYTES)!"
            exit 1
          else
            echo "Size check passed: $ROM_SIZE <= $MAX_BYTES"
          fi
          
          # Compute MD5 and SHA256 checksums
          md5sum "$ROM_FILE" > "$ROM_FILE.md5"
          sha256sum "$ROM_FILE" > "$ROM_FILE.sha256"

      - name: Upload Firmware to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-4.4-${{ env.TARGET_MODEL }}-${{ env.FLASH_SIZE }}
          path: |
            /opt/padavan-4.4/trunk/images/*.trx
            /opt/padavan-4.4/trunk/images/*.md5
            /opt/padavan-4.4/trunk/images/*.sha256

      - name: Create Release & Publish Binaries
        if: ${{ env.PUSH_RELEASE == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: Padavan-${{ env.TARGET_MODEL }}-${{ github.run_number }}
          name: Padavan 4.4 ${{ env.TARGET_MODEL }} (AP Fix + Free RAM + USB Manager + Plugins)
          body: |
            ## 🚀 Padavan 4.4 固件构建发布 (${{ env.TARGET_MODEL }})
            
            - **内核版本**: Linux 4.4 MT7621AT
            - **目标机型**: ${{ env.TARGET_MODEL }} (${{ env.FLASH_SIZE }} Flash)
            - **内置核心特性**:
              - 🟢 **修复 AP 模式 IP 无法自动更新**: 包含驱动级 carrier 监测与 udhcpc 自动刷新看门狗
              - 🟢 **右上角「释放内存」**: 替换原关机按钮，一键释放 PageCache 与 Slab 并反馈可用空间
              - 🟢 **专属 USB 磁盘管理控制台**: 分区读写测速、ext4/ntfs 格式化、休眠防烧、Samba/FTP
              - 🟢 **集成插件**: Cloudflared, Caddy v2, WireGuard, VNT
            - **校验信息**: 请比对 .sha256 确保完整性
          files: |
            /opt/padavan-4.4/trunk/images/*.trx
            /opt/padavan-4.4/trunk/images/*.md5
            /opt/padavan-4.4/trunk/images/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
